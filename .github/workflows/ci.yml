name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  UV_MALWARE_CHECK: "1"

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0

      - name: Ruff check
        run: uv run --only-group lint ruff check --output-format=github

      - name: Ruff format
        run: uv run --only-group lint ruff format --check

      - name: Ty check
        run: uv run --group qa ty check --output-format=github


  test:
    needs: qa
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Run tests with coverage
        run: uv run --group test -p ${{ matrix.python-version }} pytest
